baseURL = "https://mfahim.github.io/"
locale = "en-au"
defaultContentLanguage = "en"
title = "Notes to Myself on Software Development"
theme = "PaperMod"
copyright = "This work is licensed under a [Creative Commons Attribution-NonCommercial 4.0 International License](https://creativecommons.org/licenses/by-nc/4.0/)."
enableEmoji = true  # Shorthand emojis in content files - https://gohugo.io/functions/emojify/
enableRobotsTXT = true

[module.hugoVersion]
  min = "0.167.0"
  extended = true

[services.rss]
  limit = 10  # Maximum number of items in the RSS feed.

[taxonomies]
  tag = "tags"

[markup.highlight]
  noClasses = false  # PaperMod ships the Chroma class styles

[params]
  env = "production"
  author = "Mohammad Fahim"
  description = "Notes to myself on software development."
  mainSections = ["posts"]
  DateFormat = "2 January 2006"

  # Follow the reader's OS setting via prefers-color-scheme; no manual toggle.
  defaultTheme = "auto"
  disableThemeToggle = true

  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowShareButtons = false
  ShowBreadCrumbs = false
  ShowFullTextinRSS = false

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "favicon.svg"
    theme_color = "#F3EEE4"
    msapplication_TileColor = "#F3EEE4"

  [params.homeInfoParams]
    Title = "Notes to Myself on Software Development"
    Content = "“It is better to be clear than to be clever.”"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/mohammad-fahim-05223142/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mfahim"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menu]

  [[menu.main]]
    name = "Posts"
    url = "posts/"
    weight = 10

  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 20

  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 30

  [[menu.main]]
    name = "Newsletter"
    url = "https://foreverdraft.substack.com"
    weight = 40
